<!doctype html>
<html><head><meta charset="utf-8"><title>Dice Physics Tests</title>
<style>body{background:#0d0b0a;color:#eee;font:16px/1.45 system-ui,sans-serif;padding:24px}h1{font-size:44px;margin:0 0 12px}.pass{color:#4fe08a}.fail{color:#ff5a5a}td{padding:2px 12px}</style>
<script type="importmap">{"imports":{"three":"../vendor/three/build/three.module.js","three/addons/":"../vendor/three/jsm/"}}</script>
</head><body><h1 id="sum">Running…</h1><div id="out"></div>
<script>window.onerror = (m, s, l) => { document.getElementById('sum').textContent = 'ERROR: ' + m + ' @' + s + ':' + l; };</script>
<script type="module">
window.onerror = (m, s, l, c, e) => { document.getElementById('sum').textContent = 'ERROR: ' + m + ' ' + (e && e.stack || ''); };
window.addEventListener('unhandledrejection', (ev) => { document.getElementById('sum').textContent = 'ERROR: ' + (ev.reason && ev.reason.stack || ev.reason); });
import { simulateThrow, DIE_SIZE, obbPenetration, FACE_AXES } from '../src/physics.js';
import { FELT } from '../src/bets.js';
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const N = Number(new URLSearchParams(location.search).get('n') || 60);
let both = 0, valid = 0, durs = [], faces = [0, 0, 0, 0, 0, 0], wallHits = 0, maxPen = 0, minSep = 9, t0 = performance.now(), escaped = 0, maxOverlap = 0, minCentre = 9, attempts = 0, maxTilt = 0, maxJitter = 0;
const upDot = (q, ax) => { const [x, y, z, w] = q, [a, b, c] = ax; return a * 2 * (x * y + w * z) + b * (1 - 2 * (x * x + z * z)) + c * 2 * (y * z - w * x); };
const spreads = [], wallDist = []; const worst = [];
const pct = (a, p) => { const s = a.slice().sort((x, y) => x - y); return s[Math.min(s.length - 1, Math.floor(p * s.length))]; }, med = (a) => pct(a, 0.5);
for (let k = 0; k < N; k++) {
  const sim = simulateThrow(rng(1000 + k));
  if (sim.valid) valid++;
  durs.push(sim.duration);
  sim.up.forEach((u) => faces[u]++);
  if (sim.impacts.some((i) => i.type === 'wall')) wallHits++;
  if (sim.wallDice === 2) both++;
  attempts += sim.attempts || 1;
  const L = sim.frames[sim.frames.length - 1];
  spreads.push(Math.hypot(L.p[0] - L.p[3], L.p[2] - L.p[5]) / DIE_SIZE);
  worst.push([spreads[spreads.length - 1], k, L.p.map((v) => v.toFixed(2)).join(","), sim.tight, sim.attempts]);
  wallDist.push(Math.max(FELT.hw - 0.15 - L.p[0], FELT.hw - 0.15 - L.p[3]) / DIE_SIZE - 0.5);
  for (let i = 0; i < 2; i++) { const d = upDot(L.q.slice(i * 4, i * 4 + 4), FACE_AXES[sim.up[i]]); maxTilt = Math.max(maxTilt, Math.acos(Math.min(1, d)) * 180 / Math.PI); }
  // jitter: how far either die moves during the last 0.25 s of the recording (it should be at rest)
  for (let k = Math.max(0, sim.frames.length - 16); k < sim.frames.length; k++) { const f = sim.frames[k]; for (let c = 0; c < 6; c++) maxJitter = Math.max(maxJitter, Math.abs(f.p[c] - L.p[c])); }
  for (const f of sim.frames) {
    for (let i = 0; i < 2; i++) { const x = f.p[i * 3], y = f.p[i * 3 + 1], z = f.p[i * 3 + 2];
      maxPen = Math.max(maxPen, DIE_SIZE / 2 - y);
      if (Math.abs(x) > FELT.hw - 0.14 || Math.abs(z) > FELT.hd - 0.14) escaped++; }
    minCentre = Math.min(minCentre, Math.hypot(f.p[0] - f.p[3], f.p[1] - f.p[4], f.p[2] - f.p[5]));
    // exact OBB-vs-OBB separating-axis test on the seated (played-back) poses
    maxOverlap = Math.max(maxOverlap, obbPenetration(f.p.slice(0, 3), f.q.slice(0, 4), f.p.slice(3, 6), f.q.slice(4, 8), DIE_SIZE / 2).depth);
  }
}
const ms = (performance.now() - t0) / N;
const checks = [
  ['valid throws', valid / N >= 0.95, `${valid}/${N}`],
  ['bounce off back wall', wallHits / N >= 0.8, `${wallHits}/${N}`],
  ['both dice hit back wall', both / N >= 0.98, `${both}/${N} · ${(attempts / N).toFixed(1)} sims/throw`],
  ['no felt penetration (<1.5mm)', maxPen < 0.015, maxPen.toFixed(4)],
  ['dice stay inside rubber', escaped === 0, escaped],
  ['dice never interpenetrate (OBB SAT, every frame)', maxOverlap < 0.0003, `max depth ${maxOverlap.toFixed(5)} · min centre gap ${minCentre.toFixed(3)}`],
  ['rest flat (final tilt < 0.1°)', maxTilt < 0.1, maxTilt.toFixed(4) + '°'],
  ['no jitter at rest (last 0.25 s < 0.5 mm)', maxJitter < 0.005, maxJitter.toFixed(5)],
  ['duration 1.2-5s', durs.every((d) => d > 1.2 && d < 5.5), `${Math.min(...durs).toFixed(2)}..${Math.max(...durs).toFixed(2)}s`],
  ['rest spread between dice (median < 3.5, max < 6 die widths)', med(spreads) < 3.5 && Math.max(...spreads) < 6, `median ${med(spreads).toFixed(2)} · p90 ${pct(spreads, 0.9).toFixed(2)} · max ${Math.max(...spreads).toFixed(2)}`],
  ['farther die rests near back wall (median < 3.5, max < 7 die widths)', med(wallDist) < 3.5 && Math.max(...wallDist) < 7, `median ${med(wallDist).toFixed(2)} · p90 ${pct(wallDist, 0.9).toFixed(2)} · max ${Math.max(...wallDist).toFixed(2)}`],
  ['sim cost', ms < 400, ms.toFixed(0) + ' ms/throw'],
];
const ok = checks.every((c) => c[1]);
document.getElementById('sum').innerHTML = `<span class="${ok ? 'pass' : 'fail'}">${ok ? 'PASS' : 'FAIL'}</span> dice physics · ${checks.filter((c) => c[1]).length}/${checks.length}`;
document.getElementById('out').innerHTML = '<table>' + checks.map((c) => `<tr><td class="${c[1] ? 'pass' : 'fail'}">${c[1] ? 'PASS' : 'FAIL'}</td><td>${c[0]}</td><td>${c[2]}</td></tr>`).join('') + `</table><p>Up-axis distribution (raw physics, ±x ±y ±z): ${faces.join(' / ')}</p><p>worst: ${worst.sort((a, b) => b[0] - a[0]).slice(0, 5).map((w) => `#${w[1]} ${w[0].toFixed(1)}w [${w[2]}] tight=${w[3]} att=${w[4]}`).join("<br>")}</p><p>N=${N} · run ${new Date().toLocaleString()}</p>`;
</script></body></html>
