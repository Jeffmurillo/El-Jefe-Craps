<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Craps Rules Tests</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: radial-gradient(1200px 500px at 20% -10%, #15301f 0%, #0b0d10 60%) fixed, #0b0d10; color: #e8e4da; font: 13px/1.4 "Segoe UI", Arial, sans-serif; }
  header { padding: 22px 36px 16px; display: flex; align-items: center; gap: 28px; border-bottom: 1px solid #23262b; flex-wrap: wrap; }
  #banner { font: 800 56px/1 "Segoe UI", Arial, sans-serif; letter-spacing: 3px; padding: 14px 32px; border-radius: 14px; background: #333; }
  #banner.pass { background: linear-gradient(180deg, #13804a, #0c5a33); color: #d6ffe8; box-shadow: 0 0 50px #19c27455, inset 0 1px 0 #3fe39a88; }
  #banner.fail { background: linear-gradient(180deg, #9a1626, #6b0f1a); color: #ffe0e4; box-shadow: 0 0 50px #ff3b5555, inset 0 1px 0 #ff7a8a88; }
  #summary { font-size: 22px; font-weight: 600; }
  #summary .fails { margin-top: 8px; font-size: 12px; font-weight: 400; color: #ffb3bc; max-width: 640px; } #summary .fails b { color: #ff5b6b; }
  #summary small { display: block; color: #9a958a; font-size: 13px; font-weight: 400; margin-top: 5px; }
  #edges { margin-left: auto; font-size: 12px; color: #b9b3a5; display: grid; grid-template-columns: repeat(4, auto); gap: 2px 18px; }
  #edges b { color: #d4af37; font-weight: 600; }
  main { columns: 4 340px; column-gap: 24px; padding: 10px 36px 40px; }
  .t { break-inside: avoid; display: flex; gap: 8px; padding: 2px 0; border-bottom: 1px solid #1a1d21; }
  .t b { width: 40px; flex: none; font-weight: 700; font-size: 11px; padding-top: 1px; }
  .t i { margin-left: auto; color: #6c6a64; font-style: normal; font-size: 11px; flex: none; }
  .t.ok b { color: #46d38a; } .t.bad b { color: #ff5b6b; } .t.bad { background: #2a0f13; }
  .t .msg { color: #ff9aa5; display: block; font-size: 11px; }
  h2 { break-after: avoid; font-size: 12px; color: #d4af37; letter-spacing: 2px; text-transform: uppercase; margin: 14px 0 4px; border-bottom: 1px solid #3a3320; padding-bottom: 3px; display: flex; gap: 10px; align-items: baseline; }
  h2 .cnt { margin-left: auto; font-style: normal; letter-spacing: .5px; font-size: 11px; color: #46d38a; font-weight: 600; }
  h2.bad { color: #ff5b6b; border-bottom-color: #5a1a22; } h2.bad .cnt { color: #ff5b6b; }
</style>
</head>
<body>
<header><div id="banner">RUNNING…</div><div id="summary"></div><div id="edges"></div></header>
<main id="out"></main>
<script>
  function showErr(m) { const b = document.getElementById('banner'); b.className = 'fail'; b.textContent = 'ERROR'; document.getElementById('summary').textContent = m; }
  window.onerror = (m, s, l, c, e) => showErr(m + ' @' + l + ':' + c + (e && e.stack ? '\n' + e.stack : ''));
  window.addEventListener('unhandledrejection', (e) => showErr('Unhandled: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)));
</script>
<script type="module">
import {
  CrapsGame, makeRng, rollDie, rollDice, autoStrategy, POINTS, payout, vig, betInfo, stickCall, parseBetId,
  isValidBetId, betGroup, expectedValue, TRUE_ODDS, LAY_ODDS, PLACE_PAYS, WAYS,
  HOP_IDS, hopId, probAllBeforeSeven, ATS, FIRE_PAYS, sanitizeSettings, PUT_WARN, PUT_RAISE_WARN,
} from '../src/rules.js';

const out = document.getElementById('out');
let pass = 0, fail = 0, asserts = 0;
// every section header carries its own live tally ("12/12"), red if anything in it failed
let cur = null; const failures = [];
function section(name) {
  const h = document.createElement('h2'); h.innerHTML = `<span></span><em class="cnt"></em>`; h.firstChild.textContent = name; out.appendChild(h);
  cur = { h, pass: 0, fail: 0 }; return cur;
}
function tally(sec, okd) { if (!sec) return; okd ? sec.pass++ : sec.fail++; const c = sec.h.querySelector('.cnt'); c.textContent = `${sec.pass}/${sec.pass + sec.fail}`; sec.h.classList.toggle('bad', sec.fail > 0); }
function test(name, fn) {
  const row = document.createElement('div');
  const a0 = asserts;
  try { fn(); pass++; tally(cur, true); row.className = 't ok'; row.innerHTML = `<b>PASS</b><span>${name}</span><i>${asserts - a0}</i>`; }
  catch (e) { fail++; failures.push([name, e.message]); tally(cur, false); row.className = 't bad'; row.innerHTML = `<b>FAIL</b><span>${name}<span class="msg">${e.message}</span></span>`; }
  out.appendChild(row);
}
function eq(a, b, what = '') { asserts++; if (a !== b) throw new Error(`${what} expected ${JSON.stringify(b)} got ${JSON.stringify(a)}`); }
function ok(c, what) { asserts++; if (!c) throw new Error(what || 'assertion failed'); }
function near(a, b, tol, what = '') { asserts++; if (!(Math.abs(a - b) <= tol)) throw new Error(`${what} expected ≈${b} ±${tol} got ${a}`); }
const G = (bank = 1000, s) => new CrapsGame({ bankroll: bank, settings: s });
const ev = (r, id) => r.events.find((e) => e.id === id);
const DICE = { 2: [1, 1], 3: [1, 2], 4: [1, 3], 5: [1, 4], 6: [2, 4], 7: [3, 4], 8: [3, 5], 9: [4, 5], 10: [4, 6], 11: [5, 6], 12: [6, 6] };
const HARD = { 4: [2, 2], 6: [3, 3], 8: [4, 4], 10: [5, 5] };
const R = (g, t) => g.resolveRoll(...DICE[t]);
function withPoint(g, n) { return R(g, n); }
const worth = (g) => g.bankroll + g.totalOnTable() + g.prepaidVig();
const isOff = (e) => !!e && e.type === 'push' && e.off === true && e.down === false;

// ============================================================
section('Pass Line');
test('Come-out 7 wins even money and bet stays up', () => { const g = G(); g.placeBet('pass', 10); const r = R(g, 7); eq(ev(r, 'pass').win, 10); eq(ev(r, 'pass').down, false); eq(g.bets.pass, 10); eq(g.bankroll, 1000); eq(r.outcome, 'natural'); });
test('Come-out 11 wins', () => { const g = G(); g.placeBet('pass', 10); const r = R(g, 11); eq(g.bankroll, 1000); eq(g.bets.pass, 10); eq(r.outcome, 'natural'); });
for (const t of [2, 3, 12]) test(`Come-out ${t} (craps) loses`, () => { const g = G(); g.placeBet('pass', 10); const r = R(g, t); eq(g.bets.pass, undefined); eq(g.bankroll, 990); eq(g.point, null); eq(r.outcome, 'craps'); });
for (const n of POINTS) test(`Come-out ${n} sets the point (puck ON ${n})`, () => { const g = G(); g.placeBet('pass', 10); const r = withPoint(g, n); eq(g.point, n); eq(r.outcome, 'point-set'); eq(g.puck.on, true); eq(g.puck.point, n); eq(ev(r, 'pass'), undefined); });
test('Point made pays 1:1, odds on 6 pay 6:5 and come down', () => { const g = G(); g.placeBet('pass', 10); R(g, 6); g.placeBet('passOdds', 50); const r = g.resolveRoll(5, 1); eq(ev(r, 'pass').win, 10); eq(ev(r, 'passOdds').win, 60); eq(ev(r, 'passOdds').down, true); eq(r.outcome, 'point-made'); eq(g.point, null); eq(g.puck.on, false); eq(g.bankroll, 1000 - 10 + 10 + 60); eq(g.bets.pass, 10); eq(g.bets.passOdds, undefined); });
for (const [n, flat, odds, w] of [[4, 10, 30, 60], [10, 10, 30, 60], [5, 10, 40, 60], [9, 10, 40, 60], [6, 10, 50, 60], [8, 10, 50, 60]]) test(`Pass odds on ${n}: $${odds} pays $${w}`, () => { const g = G(); g.placeBet('pass', flat); R(g, n); eq(g.placeBet('passOdds', odds).ok, true); const r = R(g, n); eq(ev(r, 'passOdds').win, w); eq(ev(r, 'pass').win, flat); });
test('Point made the hard way still pays the line', () => { const g = G(); g.placeBet('pass', 10); R(g, 8); const r = g.resolveRoll(4, 4); eq(r.outcome, 'point-made'); eq(ev(r, 'pass').win, 10); });
test('Seven-out loses pass and odds', () => { const g = G(); g.placeBet('pass', 10); R(g, 8); g.placeBet('passOdds', 50); const r = R(g, 7); eq(r.outcome, 'seven-out'); eq(g.bankroll, 940); eq(g.point, null); eq(Object.keys(g.bets).length, 0); eq(r.net, -60); eq(r.totalLost, 60); });
test('Pass line cannot be removed once point is on (contract)', () => { const g = G(); g.placeBet('pass', 10); R(g, 8); eq(g.canRemove('pass').ok, false); eq(g.removeBet('pass').ok, false); eq(g.bets.pass, 10); eq(g.bankroll, 990); });
test('Pass line can be removed on come-out', () => { const g = G(); g.placeBet('pass', 10); eq(g.removeBet('pass').ok, true); eq(g.bankroll, 1000); eq(g.bets.pass, undefined); });
test('Pass line cannot be added or increased after point (put bets disabled)', () => { const g = G(1000, { putBets: false }); g.placeBet('pass', 10); R(g, 8); eq(g.placeBet('pass', 5).ok, false); eq(g.bets.pass, 10); });
test('Non-decision roll leaves pass alone', () => { const g = G(); g.placeBet('pass', 10); R(g, 8); const r = R(g, 5); eq(g.point, 8); eq(g.bets.pass, 10); eq(r.outcome, 'roll'); eq(ev(r, 'pass'), undefined); });
test('11 and craps during a point do not affect the line', () => { const g = G(); g.placeBet('pass', 10); R(g, 8); for (const t of [2, 3, 11, 12]) R(g, t); eq(g.point, 8); eq(g.bets.pass, 10); });

// ============================================================
section('Odds limits & rules');
for (const [n, m] of [[4, 3], [5, 4], [6, 5], [8, 5], [9, 4], [10, 3]]) test(`3-4-5x: point ${n} max odds ${m}x flat`, () => { const g = G(); g.placeBet('pass', 10); withPoint(g, n); eq(g.maxFor('passOdds'), 10 * m); eq(g.placeBet('passOdds', 10 * m + 1).ok, false); eq(g.placeBet('passOdds', 10 * m).ok, true); });
test('3-4-5x max odds always win exactly 6x flat', () => { for (const n of POINTS) { const g = G(); g.placeBet('pass', 10); R(g, n); g.placeBet('passOdds', g.maxFor('passOdds')); eq(ev(R(g, n), 'passOdds').win, 60, 'n' + n); } });
test('Odds require a point', () => { const g = G(); g.placeBet('pass', 10); eq(g.placeBet('passOdds', 10).ok, false); });
test('Odds require a flat bet', () => { const g = G(); g.placeBet('dontPass', 10); R(g, 6); eq(g.placeBet('passOdds', 10).ok, false); });
test('Odds can be increased up to the cap in steps', () => { const g = G(); g.placeBet('pass', 10); R(g, 6); eq(g.placeBet('passOdds', 30).ok, true); eq(g.placeBet('passOdds', 20).ok, true); eq(g.placeBet('passOdds', 1).ok, false); eq(g.bets.passOdds, 50); });
test('Lay odds max 6x flat on every number', () => { for (const n of POINTS) { const g = G(5000); g.placeBet('dontPass', 10); withPoint(g, n); const m = g.maxFor('dontPassOdds'); eq(m, 60, 'n' + n); eq(g.placeBet('dontPassOdds', m + 1).ok, false, 'n' + n); eq(g.placeBet('dontPassOdds', m).ok, true, 'n' + n); } });
test('Max lay odds win 3x / 4x / 5x flat (mirrors 3-4-5x)', () => { for (const [n, w] of [[4, 30], [10, 30], [5, 40], [9, 40], [6, 50], [8, 50]]) { const g = G(); g.placeBet('dontPass', 10); R(g, n); g.placeBet('dontPassOdds', g.maxFor('dontPassOdds')); eq(ev(R(g, 7), 'dontPassOdds').win, w, 'n' + n); } });
test('Odds can be taken down any time', () => { const g = G(); g.placeBet('pass', 10); R(g, 6); g.placeBet('passOdds', 20); eq(g.removeBet('passOdds').ok, true); eq(g.bankroll, 990); });
test('Numeric odds setting (10x) caps at 10x flat', () => { const g = G(5000, { odds: 10 }); g.placeBet('pass', 10); R(g, 4); eq(g.maxFor('passOdds'), 100); eq(g.placeBet('passOdds', 101).ok, false); eq(g.placeBet('passOdds', 100).ok, true); eq(ev(R(g, 4), 'passOdds').win, 200); });
test('Numeric odds setting (2x) lay cap', () => { const g = G(5000, { odds: 2 }); g.placeBet('dontPass', 10); R(g, 4); eq(g.maxFor('dontPassOdds'), 40); });
test('Odds breakage floors (raw-odds table): $25 odds on 5 pays $37', () => { const g = G(1000, { oddsUnits: false }); g.placeBet('pass', 10); R(g, 5); g.placeBet('passOdds', 25); eq(ev(R(g, 5), 'passOdds').win, 37); });
test('Odds breakage floors (raw-odds table): $7 odds on 6 pays $8', () => { const g = G(1000, { oddsUnits: false }); g.placeBet('pass', 10); R(g, 6); g.placeBet('passOdds', 7); eq(ev(R(g, 6), 'passOdds').win, 8); });
test('payableAmount rounds odds/place to clean units', () => { const g = G(); g.placeBet('pass', 10); R(g, 5); eq(g.payableAmount('passOdds', 25), 24); eq(g.payableAmount('place6', 20), 18); eq(g.payableAmount('place5', 13), 10); eq(g.payableAmount('lay4', 41), 40); eq(g.payableAmount('horn', 6), 4); });

// ============================================================
section("Don't Pass");
test('Come-out 2 and 3 win', () => { for (const t of [2, 3]) { const g = G(); g.placeBet('dontPass', 10); R(g, t); eq(g.bankroll, 1000); eq(g.bets.dontPass, 10); } });
test('Come-out 12 is barred (push, stays up)', () => { const g = G(); g.placeBet('dontPass', 10); const r = R(g, 12); eq(ev(r, 'dontPass').type, 'push'); eq(ev(r, 'dontPass').down, false); eq(ev(r, 'dontPass').note, 'Bar 12'); eq(g.bankroll, 990); eq(g.bets.dontPass, 10); eq(r.net, 0); });
test('Come-out 7/11 lose', () => { for (const t of [7, 11]) { const g = G(); g.placeBet('dontPass', 10); R(g, t); eq(g.bankroll, 990); eq(g.bets.dontPass, undefined); } });
test('Seven after point wins; lay odds on 4 pay 1:2', () => { const g = G(); g.placeBet('dontPass', 10); R(g, 4); g.placeBet('dontPassOdds', 40); const r = R(g, 7); eq(ev(r, 'dontPass').win, 10); eq(ev(r, 'dontPassOdds').win, 20); eq(g.bankroll, 1000 - 10 + 10 + 20); });
test('Lay odds on 5/9 pay 2:3', () => { for (const n of [5, 9]) { const g = G(); g.placeBet('dontPass', 10); R(g, n); g.placeBet('dontPassOdds', 60); eq(ev(R(g, 7), 'dontPassOdds').win, 40, 'n' + n); } });
test('Lay odds on 6/8 pay 5:6', () => { for (const n of [6, 8]) { const g = G(); g.placeBet('dontPass', 10); R(g, n); g.placeBet('dontPassOdds', 60); eq(ev(R(g, 7), 'dontPassOdds').win, 50, 'n' + n); } });
test("Point repeat loses don't pass and lay odds", () => { const g = G(); g.placeBet('dontPass', 10); R(g, 9); g.placeBet('dontPassOdds', 30); const r = R(g, 9); eq(ev(r, 'dontPass').type, 'lose'); eq(ev(r, 'dontPassOdds').type, 'lose'); eq(g.bankroll, 960); });
test("Don't pass can be removed after point (takes odds too)", () => { const g = G(); g.placeBet('dontPass', 10); R(g, 9); g.placeBet('dontPassOdds', 30); const rm = g.removeBet('dontPass'); eq(rm.ok, true); eq(rm.removed.length, 2); eq(g.bankroll, 1000); });
test("Don't pass not accepted after point", () => { const g = G(); g.placeBet('pass', 10); R(g, 9); eq(g.placeBet('dontPass', 10).ok, false); });
test('Pass and don\'t pass together: 12 on come-out', () => { const g = G(); g.placeBet('pass', 10); g.placeBet('dontPass', 10); const r = R(g, 12); eq(ev(r, 'pass').type, 'lose'); eq(ev(r, 'dontPass').type, 'push'); eq(worth(g), 990); });

// ============================================================
section("Come / Don't Come");
test('Come only after point', () => { const g = G(); eq(g.placeBet('come', 10).ok, false); eq(g.placeBet('dontCome', 10).ok, false); });
test('Cannot bet directly on a come number when put bets are disabled', () => { const g = G(1000, { putBets: false }); g.placeBet('pass', 10); R(g, 6); eq(g.placeBet('come5', 10).ok, false); });
test('Come travels to the number', () => { const g = G(); g.placeBet('pass', 10); R(g, 6); g.placeBet('come', 10); const r = R(g, 5); eq(ev(r, 'come').type, 'move'); eq(ev(r, 'come').to, 'come5'); eq(g.bets.come5, 10); eq(g.bets.come, undefined); });
test('Come on 5 wins flat + 3:2 odds, then comes down', () => { const g = G(); g.placeBet('pass', 10); R(g, 6); g.placeBet('come', 10); R(g, 5); g.placeBet('comeOdds5', 20); const r = g.resolveRoll(1, 4); eq(ev(r, 'come5').win, 10); eq(ev(r, 'come5').down, true); eq(ev(r, 'comeOdds5').win, 30); eq(g.bets.come5, undefined); eq(g.bankroll, 1000 - 10 + 10 + 30); });
test('Come odds 3-4-5x caps on each number', () => { for (const [n, m] of [[4, 3], [5, 4], [6, 5], [8, 5], [9, 4], [10, 3]]) { const g = G(); g.placeBet('pass', 10); R(g, n === 6 ? 8 : 6); g.placeBet('come', 10); R(g, n); eq(g.maxFor('comeOdds' + n), 10 * m, 'n' + n); } });
test('Come bar: 7 and 11 win, craps lose', () => { const g = G(); g.placeBet('pass', 10); R(g, 6); g.placeBet('come', 10); R(g, 11); eq(g.bankroll, 1000); g.placeBet('come', 10); R(g, 2); eq(g.bankroll, 990); });
test('Come bar 7 wins while pass sevens out', () => { const g = G(); g.placeBet('pass', 10); R(g, 6); g.placeBet('come', 10); const r = R(g, 7); eq(ev(r, 'come').win, 10); eq(ev(r, 'pass').type, 'lose'); eq(g.bankroll, 1000); });
test('Come odds are OFF on come-out: 7 loses flat, returns odds', () => { const g = G(); g.placeBet('pass', 10); R(g, 6); g.placeBet('come', 10); R(g, 8); g.placeBet('comeOdds8', 50); g.resolveRoll(3, 3); eq(g.point, null); const r = R(g, 7); eq(ev(r, 'come8').type, 'lose'); eq(ev(r, 'comeOdds8').type, 'push'); eq(ev(r, 'comeOdds8').down, true); });
test('Come odds OFF on come-out: number hits, flat wins, odds returned', () => { const g = G(); g.placeBet('pass', 10); R(g, 6); g.placeBet('come', 10); R(g, 8); g.placeBet('comeOdds8', 50); g.resolveRoll(3, 3); const r = g.resolveRoll(4, 4); eq(ev(r, 'come8').win, 10); eq(ev(r, 'comeOdds8').type, 'push'); });
test('comeOddsWorkingOnComeOut setting pays odds on come-out', () => { const g = G(1000, { comeOddsWorkingOnComeOut: true }); g.placeBet('pass', 10); R(g, 6); g.placeBet('come', 10); R(g, 8); g.placeBet('comeOdds8', 50); R(g, 6); const r = R(g, 8); eq(ev(r, 'comeOdds8').win, 60); });
test('Per-bet override: come odds turned ON for the come-out', () => { const g = G(); g.placeBet('pass', 10); R(g, 6); g.placeBet('come', 10); R(g, 8); g.placeBet('comeOdds8', 50); R(g, 6); g.setWorking('comeOdds8', true); eq(ev(R(g, 8), 'comeOdds8').win, 60); });
test('Come bet on number cannot be removed (contract)', () => { const g = G(); g.placeBet('pass', 10); R(g, 6); g.placeBet('come', 10); R(g, 9); eq(g.removeBet('come9').ok, false); eq(g.bets.come9, 10); });
test('Come off-and-on: new come bet travels to a number that just won', () => { const g = G(); g.placeBet('pass', 10); R(g, 6); g.placeBet('come', 10); R(g, 5); g.placeBet('come', 15); const r = R(g, 5); eq(ev(r, 'come5').win, 10); eq(ev(r, 'come').to, 'come5'); eq(g.bets.come5, 15); });
test('Multiple come bets on different numbers all lose on 7', () => { const g = G(); g.placeBet('pass', 10); R(g, 6); for (const t of [4, 9]) { g.placeBet('come', 10); R(g, t); } eq(g.bets.come4, 10); eq(g.bets.come9, 10); R(g, 7); eq(g.totalOnTable(), 0); eq(g.bankroll, 970); });
test("Don't come travels and wins on 7 with lay odds (1:2 on 10)", () => { const g = G(); g.placeBet('pass', 10); R(g, 6); g.placeBet('dontCome', 10); R(g, 10); eq(g.bets.dontCome10, 10); g.placeBet('dontComeOdds10', 20); const r = R(g, 7); eq(ev(r, 'dontCome10').win, 10); eq(ev(r, 'dontComeOdds10').win, 10); });
test("Don't come lay odds work on the come-out", () => { const g = G(); g.placeBet('pass', 10); R(g, 6); g.placeBet('dontCome', 10); R(g, 9); g.placeBet('dontComeOdds9', 30); R(g, 6); eq(g.point, null); const r = R(g, 7); eq(ev(r, 'dontComeOdds9').win, 20); });
test("Don't come on number loses when number repeats", () => { const g = G(); g.placeBet('pass', 10); R(g, 6); g.placeBet('dontCome', 10); R(g, 4); g.placeBet('dontComeOdds4', 20); const r = R(g, 4); eq(ev(r, 'dontCome4').type, 'lose'); eq(ev(r, 'dontComeOdds4').type, 'lose'); });
test("Don't come bar: 2/3 win, 7/11 lose, 12 pushes", () => { const g = G(); g.placeBet('pass', 10); R(g, 6); g.placeBet('dontCome', 10); eq(ev(R(g, 3), 'dontCome').win, 10); g.placeBet('dontCome', 10); eq(ev(R(g, 11), 'dontCome').type, 'lose'); g.placeBet('dontCome', 10); const r = R(g, 12); eq(ev(r, 'dontCome').type, 'push'); eq(ev(r, 'dontCome').down, false); eq(ev(r, 'dontCome').note, 'Bar 12'); eq(g.bets.dontCome, 10); });
test("Don't come barred on 12 stays in the box, then travels", () => { const g = G(); g.placeBet('pass', 10); R(g, 6); g.placeBet('dontCome', 10); const b0 = g.bankroll; R(g, 12); eq(g.bankroll, b0); eq(g.bets.dontCome, 10); const r = R(g, 9); eq(ev(r, 'dontCome').to, 'dontCome9'); eq(g.bets.dontCome9, 10); });
test("Don't pass and don't come both bar 12 identically", () => { const g = G(); g.placeBet('dontPass', 10); const a = ev(R(g, 12), 'dontPass'); R(g, 6); g.placeBet('dontCome', 10); const c = ev(R(g, 12), 'dontCome'); eq(a.type, c.type); eq(a.down, c.down); eq(a.returned, c.returned); });
test("Don't come on number can be removed, with its odds", () => { const g = G(); g.placeBet('pass', 10); R(g, 6); g.placeBet('dontCome', 10); R(g, 4); g.placeBet('dontComeOdds4', 20); const rm = g.removeBet('dontCome4'); eq(rm.ok, true); eq(rm.removed.length, 2); eq(g.bankroll, 990); });

// ============================================================
section('Place / Buy / Lay');
test('Place 6 $12 pays $14 and stays up', () => { const g = G(); g.placeBet('pass', 10); R(g, 8); g.placeBet('place6', 12); const r = g.resolveRoll(2, 4); eq(ev(r, 'place6').win, 14); eq(ev(r, 'place6').down, false); eq(g.bets.place6, 12); });
test('Place 8 $30 pays $35', () => { const g = G(); g.placeBet('pass', 10); R(g, 6); g.placeBet('place8', 30); eq(ev(R(g, 8), 'place8').win, 35); });
test('Place 5 $10 pays $14; place 4 $10 pays $18', () => { const g = G(); g.placeBet('pass', 10); R(g, 8); g.placeBet('place5', 10); g.placeBet('place4', 10); eq(ev(R(g, 5), 'place5').win, 14); eq(ev(g.resolveRoll(2, 2), 'place4').win, 18); });
test('Place 9 $5 pays $7; place 10 $5 pays $9', () => { const g = G(); g.placeBet('pass', 10); R(g, 8); g.placeBet('place9', 5); g.placeBet('place10', 5); eq(ev(R(g, 9), 'place9').win, 7); eq(ev(g.resolveRoll(5, 5), 'place10').win, 9); });
test('Place 6 $5 breakage pays $5', () => { const g = G(); g.placeBet('pass', 10); R(g, 8); g.placeBet('place6', 5); eq(ev(R(g, 6), 'place6').win, 5); });
test('Place bets lose on seven-out', () => { const g = G(); g.placeBet('pass', 10); R(g, 8); g.placeBet('place6', 12); R(g, 7); eq(g.bets.place6, undefined); });
test('Place bets are OFF on the come-out by default', () => { const g = G(); g.placeBet('place6', 12); eq(g.isWorking('place6'), false); const r = R(g, 7); ok(isOff(ev(r, 'place6')), 'OFF event'); eq(g.bets.place6, 12); R(g, 6); eq(g.bets.place6, 12); eq(g.isWorking('place6'), true); });
test('Working toggle: place bets act on the come-out', () => { const g = G(1000, { placeWorkingOnComeOut: true }); g.placeBet('place6', 12); R(g, 7); eq(g.bets.place6, undefined); });
test('Per-bet OFF during a point: place bet ignores 7', () => { const g = G(); g.placeBet('pass', 10); R(g, 8); g.placeBet('place6', 12); g.setWorking('place6', false); R(g, 6); eq(g.bankroll, 978); R(g, 7); eq(g.bets.place6, 12); g.setWorking('place6', null); eq(g.isWorking('place6'), false, 'default off on come-out'); });
test('Place bets can be taken down', () => { const g = G(); g.placeBet('pass', 10); R(g, 8); g.placeBet('place6', 12); eq(g.removeBet('place6').ok, true); eq(g.bankroll, 990); });
test('Buy 4 $20 pays $40 minus $1 vig', () => { const g = G(); g.placeBet('pass', 10); R(g, 6); g.placeBet('buy4', 20); eq(ev(R(g, 4), 'buy4').win, 39); });
test('Buy 10 $40 pays $80 minus $2 vig', () => { const g = G(); g.placeBet('pass', 10); R(g, 6); g.placeBet('buy10', 40); eq(ev(R(g, 10), 'buy10').win, 78); });
test('Buy bets are OFF on come-out by default', () => { const g = G(); g.placeBet('buy4', 20); ok(isOff(ev(R(g, 4), 'buy4')), 'OFF event'); eq(g.bets.buy4, 20); });
test('Lay 4 $40 wins $20 minus $1 vig on 7', () => { const g = G(); g.placeBet('lay4', 40); eq(ev(R(g, 7), 'lay4').win, 19); eq(g.bets.lay4, 40); });
test('Lay 6 $60 wins $50 minus $2 vig', () => { const g = G(); g.placeBet('lay6', 60); eq(ev(R(g, 7), 'lay6').win, 48); });
test('Lay 4 loses on 4', () => { const g = G(); g.placeBet('lay4', 40); R(g, 4); eq(g.bets.lay4, undefined); eq(g.bankroll, 960); });
test('Vig helper: 5%, minimum $1, floored', () => { eq(vig(20), 1); eq(vig(10), 1); eq(vig(100), 5); eq(vig(39), 1); eq(vig(60), 3); });

section('Field / Big 6-8 / Hardways');
test('Field 2 pays 2:1, 12 pays 3:1', () => { const g = G(); g.placeBet('field', 10); eq(ev(R(g, 2), 'field').win, 20); eq(ev(R(g, 12), 'field').win, 30); });
test('Field 12 pays 2:1 when configured', () => { const g = G(1000, { fieldTwelvePays: 2 }); g.placeBet('field', 10); eq(ev(R(g, 12), 'field').win, 20); });
test('Field 3,4,9,10,11 pay 1:1', () => { for (const t of [3, 4, 9, 10, 11]) { const g = G(); g.placeBet('field', 10); eq(ev(R(g, t), 'field').win, 10, 't' + t); } });
test('Field 5,6,7,8 lose', () => { for (const t of [5, 6, 7, 8]) { const g = G(); g.placeBet('field', 10); eq(ev(R(g, t), 'field').type, 'lose', 't' + t); } });
test('Field winning bet stays up', () => { const g = G(); g.placeBet('field', 10); R(g, 9); eq(g.bets.field, 10); });
test('Big 6 / Big 8 pay even money, lose on 7', () => { const g = G(); g.placeBet('big6', 10); g.placeBet('big8', 10); eq(ev(R(g, 6), 'big6').win, 10); eq(ev(R(g, 8), 'big8').win, 10); R(g, 7); eq(g.totalOnTable(), 0); });
for (const [n, w] of [[4, 35], [6, 45], [8, 45], [10, 35]]) test(`Hard ${n} $5 pays $${w}`, () => { const g = G(); g.placeBet('pass', 10); R(g, n === 6 ? 5 : 6); g.placeBet('hard' + n, 5); const r = g.resolveRoll(...HARD[n]); eq(ev(r, 'hard' + n).win, w); eq(g.bets['hard' + n], 5); });
test('Hardways lose on easy way', () => { for (const n of [4, 6, 8, 10]) { const g = G(); g.placeBet('pass', 10); R(g, n === 5 ? 6 : 5); g.placeBet('hard' + n, 5); eq(ev(R(g, n), 'hard' + n).type, 'lose', 'n' + n); } });
test('Hardways lose on 7', () => { const g = G(); g.placeBet('pass', 10); R(g, 5); for (const n of [4, 6, 8, 10]) g.placeBet('hard' + n, 5); const r = R(g, 7); eq(r.events.filter((e) => /^hard/.test(e.id) && e.type === 'lose').length, 4); });
test('Hardways unaffected by other numbers', () => { const g = G(); g.placeBet('pass', 10); R(g, 5); g.placeBet('hard8', 5); for (const t of [2, 3, 4, 5, 6, 9, 10, 11, 12]) R(g, t); eq(g.bets.hard8, 5); });
test('Hardways are OFF on the come-out', () => { const g = G(); g.placeBet('hard6', 5); ok(isOff(ev(R(g, 7), 'hard6')), 'OFF event'); eq(g.bets.hard6, 5); });
test('Hardways working on come-out when set', () => { const g = G(1000, { hardwaysWorkingOnComeOut: true }); g.placeBet('hard6', 5); eq(ev(R(g, 7), 'hard6').type, 'lose'); });

section('One-roll propositions');
test('Any 7 pays 4:1', () => { const g = G(); g.placeBet('any7', 5); eq(ev(R(g, 7), 'any7').win, 20); });
test('Any craps pays 7:1 on 2, 3, 12', () => { for (const t of [2, 3, 12]) { const g = G(); g.placeBet('anyCraps', 5); eq(ev(R(g, t), 'anyCraps').win, 35, 't' + t); } });
test('Two & Twelve pay 30:1; Three & Eleven pay 15:1', () => { const g = G(); for (const [id, t, w] of [['two', 2, 30], ['twelve', 12, 30], ['three', 3, 15], ['eleven', 11, 15]]) { g.placeBet(id, 1); eq(ev(R(g, t), id).win, w, id); g.removeBet(id); } });
test('One-roll bets lose on any other number', () => { const g = G(); g.placeBet('two', 1); g.placeBet('any7', 5); g.placeBet('anyCraps', 1); g.placeBet('eleven', 1); R(g, 8); eq(g.totalOnTable(), 0); });
test('Winning one-roll bets stay up for next roll', () => { const g = G(); g.placeBet('eleven', 5); R(g, 11); eq(g.bets.eleven, 5); eq(g.bankroll, 1070); });
test('Horn $4: 2 nets $27, 11 nets $12, 7 loses', () => { const g = G(); g.placeBet('horn', 4); eq(ev(R(g, 2), 'horn').win, 27); eq(ev(R(g, 11), 'horn').win, 12); R(g, 7); eq(g.bets.horn, undefined); });
test('Horn $4: 12 nets $27, 3 nets $12', () => { const g = G(); g.placeBet('horn', 4); eq(ev(R(g, 12), 'horn').win, 27); eq(ev(R(g, 3), 'horn').win, 12); });
test('Horn $8 on 12 nets $54', () => { const g = G(); g.placeBet('horn', 8); eq(ev(R(g, 12), 'horn').win, 54); });
test('Horn minimum $4', () => { const g = G(); eq(g.placeBet('horn', 3).ok, false); });
test('Horn only in $4 units: $5/$6/$7 rejected, $12 accepted', () => { const g = G(); for (const a of [5, 6, 7, 9]) { const v = g.placeBet('horn', a); eq(v.ok, false, '$' + a); eq(v.reason, 'Horn bets are in $4 units'); } eq(g.placeBet('horn', 12).ok, true); eq(g.placeBet('horn', 1).ok, false, 'total 13'); eq(g.placeBet('horn', 4).ok, true, 'total 16'); eq(g.bankroll, 984); });
test('Horn $12 on 2 nets $81 exactly, on 3 nets $36', () => { const g = G(); g.placeBet('horn', 12); eq(ev(R(g, 2), 'horn').win, 81); eq(ev(R(g, 3), 'horn').win, 36); });
test('C&E only in $2 units', () => { const g = G(); eq(g.placeBet('ce', 3).reason, 'C & E bets are in $2 units'); eq(g.placeBet('ce', 5).ok, false); eq(g.placeBet('ce', 4).ok, true); eq(ev(R(g, 11), 'ce').win, 28); });
test('Horn High 12 ($5): 12 nets $57, 2 nets $26, 3/11 net $11, 7 loses', () => { const g = G(); g.placeBet('hornHigh12', 5); eq(ev(R(g, 12), 'hornHigh12').win, 57); eq(ev(R(g, 2), 'hornHigh12').win, 26); eq(ev(R(g, 3), 'hornHigh12').win, 11); eq(ev(R(g, 11), 'hornHigh12').win, 11); eq(ev(R(g, 7), 'hornHigh12').type, 'lose'); eq(g.bets.hornHigh12, undefined); });
test('Horn High 3 ($5): 3 nets $27, 11 nets $11, 2/12 net $26', () => { const g = G(); g.placeBet('hornHigh3', 5); eq(ev(R(g, 3), 'hornHigh3').win, 27); eq(ev(R(g, 11), 'hornHigh3').win, 11); eq(ev(R(g, 2), 'hornHigh3').win, 26); eq(ev(R(g, 12), 'hornHigh3').win, 26); });
test('Horn High in $5 units ($10 on 11 high nets $54)', () => { const g = G(); eq(g.placeBet('hornHigh11', 6).ok, false); eq(g.placeBet('hornHigh11', 10).ok, true); eq(ev(R(g, 11), 'hornHigh11').win, 54); });
test('World $5: 2/12 net $26, 3/11 net $11, 7 pushes and stays, others lose', () => { const g = G(); g.placeBet('world', 5); eq(ev(R(g, 2), 'world').win, 26); eq(ev(R(g, 12), 'world').win, 26); eq(ev(R(g, 3), 'world').win, 11); eq(ev(R(g, 11), 'world').win, 11); const b0 = g.bankroll; const p = ev(R(g, 7), 'world'); eq(p.type, 'push'); eq(p.down, false); eq(g.bankroll, b0); eq(g.bets.world, 5); eq(ev(R(g, 8), 'world').type, 'lose'); eq(g.bets.world, undefined); });
test('World in $5 units ($10 on 2 nets $52)', () => { const g = G(); eq(g.placeBet('world', 6).reason, 'World (Whirl) bets are in $5 units'); g.placeBet('world', 10); eq(ev(R(g, 2), 'world').win, 52); });
test('Hop 1-5 pays 15:1 in either dice order, loses on 2-4', () => { const g = G(); g.placeBet('hop15', 2); eq(ev(g.resolveRoll(1, 5), 'hop15').win, 30); eq(ev(g.resolveRoll(5, 1), 'hop15').win, 30); eq(g.bets.hop15, 2); eq(ev(g.resolveRoll(2, 4), 'hop15').type, 'lose'); });
test('Hard hop 3-3 pays 30:1; easy six does not pay it', () => { const g = G(); g.placeBet('hop33', 1); eq(ev(g.resolveRoll(3, 3), 'hop33').win, 30); eq(ev(g.resolveRoll(1, 5), 'hop33').type, 'lose'); });
test('Hop ids: 21 combos, canonical low-high only', () => { eq(HOP_IDS.length, 21); eq(isValidBetId('hop51'), false); eq(isValidBetId('hop15'), true); eq(isValidBetId('hop70'), false); eq(hopId(6, 2), 'hop26'); eq(G().placeBet('hop51', 1).ok, false); });
test('Multiple hops: only the matching one pays', () => { const g = G(); g.placeBet('hop16', 1); g.placeBet('hop25', 1); g.placeBet('hop34', 1); const r = g.resolveRoll(4, 3); eq(ev(r, 'hop34').win, 15); eq(ev(r, 'hop16').type, 'lose'); eq(ev(r, 'hop25').type, 'lose'); eq(r.net, 13); });
test('C&E $2: craps nets $6, eleven nets $14, 7 loses', () => { const g = G(); g.placeBet('ce', 2); eq(ev(R(g, 3), 'ce').win, 6); eq(ev(R(g, 11), 'ce').win, 14); eq(ev(R(g, 12), 'ce').win, 6); R(g, 7); eq(g.bets.ce, undefined); });

section('Table limits & validation');
test('Table minimum enforced on flat bets', () => { const g = G(); eq(g.placeBet('pass', 1).ok, false); eq(g.placeBet('field', 4).ok, false); eq(g.placeBet('field', 5).ok, true); });
test('Table maximum enforced (cumulative)', () => { const g = G(100000); eq(g.placeBet('pass', 5001).ok, false); eq(g.placeBet('pass', 4000).ok, true); eq(g.placeBet('pass', 1001).ok, false); eq(g.placeBet('pass', 1000).ok, true); });
test('Cannot bet more than bankroll', () => { const g = G(20); eq(g.placeBet('pass', 25).ok, false); eq(g.bankroll, 20); });
test('Rejects zero, negative, fractional, NaN amounts', () => { const g = G(); for (const a of [0, -5, 5.5, NaN, Infinity]) eq(g.placeBet('field', a).ok, false, String(a)); eq(g.bankroll, 1000); });
test('Rejects unknown bet ids', () => { const g = G(); eq(g.placeBet('place7', 10).ok, false); eq(g.placeBet('bogus', 10).ok, false); eq(isValidBetId('place7'), false); eq(isValidBetId('come10'), true); });
test('Invalid dice throw RangeError', () => { const g = G(); let threw = false; try { g.resolveRoll(0, 7); } catch (e) { threw = e instanceof RangeError; } ok(threw, 'expected RangeError'); });
test('Payouts floor to whole dollars (breakage)', () => { eq(payout(5, [7, 6]), 5); eq(payout(5, [3, 2]), 7); eq(payout(6, [7, 6]), 7); eq(payout(30, [6, 5]), 36); });
test('Removing a nonexistent bet fails cleanly', () => { const g = G(); const r = g.removeBet('field'); eq(r.ok, false); eq(r.removed.length, 0); });

section('Events, info & persistence');
test('Emits bet/remove/reject/roll/point/resolve events', () => {
  const g = G(); const seen = []; g.on('*', (type) => seen.push(type)); let pt = null; g.on('point', (p) => { pt = p; });
  g.placeBet('pass', 10); g.placeBet('pass', 0); g.placeBet('field', 5); g.removeBet('field'); R(g, 6);
  ok(seen.includes('bet') && seen.includes('reject') && seen.includes('remove') && seen.includes('roll') && seen.includes('point'), seen.join(','));
  eq(pt.to, 6); eq(pt.from, null);
});
test('Unsubscribe stops events', () => { const g = G(); let n = 0; const off = g.on('bet', () => n++); g.placeBet('field', 5); off(); g.placeBet('field', 5); eq(n, 1); });
test('Resolution events carry seq, name and returned amount', () => { const g = G(); g.placeBet('pass', 10); R(g, 6); g.placeBet('passOdds', 50); const r = R(g, 6); const e = ev(r, 'passOdds'); eq(e.name, 'Pass Line Odds'); eq(e.returned, 110); eq(typeof e.seq, 'number'); eq(ev(r, 'pass').returned, 10); });
test('Events ordered: win/lose resolutions match bankroll change', () => { const g = G(); g.placeBet('pass', 10); R(g, 6); g.placeBet('passOdds', 50); g.placeBet('place8', 12); g.placeBet('field', 5); g.placeBet('hard6', 5); const before = worth(g); const r = R(g, 7); eq(worth(g) - before, r.net); eq(r.events.length, 5); });
test('betInfo names and payout strings', () => { eq(betInfo('place6').name, 'Place 6'); eq(betInfo('place6').pays, '7:6'); eq(betInfo('lay4').pays.startsWith('1:2'), true); eq(betInfo('any7').oneRoll, true); eq(betInfo('hard8').pays, '9:1'); eq(betInfo('pass').oneRoll, false); eq(betInfo('comeOdds9').pays, '3:2'); });
test('betGroup / parseBetId', () => { eq(betGroup('come5'), 'come'); eq(betGroup('lay4'), 'box'); eq(betGroup('horn'), 'prop'); eq(betGroup('dontPassOdds'), 'line'); eq(parseBetId('dontComeOdds10').n, 10); eq(parseBetId('dontComeOdds10').kind, 'dontComeOdds'); });
test('Stickman calls', () => { eq(stickCall(3, 4, 6), 'Seven Out!'); eq(stickCall(3, 4, null), 'Seven, Winner!'); eq(stickCall(2, 2, 6), 'Four, the hard way'); eq(stickCall(1, 3, null), 'Easy four'); eq(stickCall(2, 4, 8), 'Easy six'); eq(stickCall(4, 4, 6), 'Eight, the hard way'); eq(stickCall(5, 6, null), 'Yo-leven, Winner!'); ok(stickCall(3, 3, 6).includes('Pay the Line'), 'point call'); });
test('winFor previews profits', () => { const g = G(); eq(g.winFor('place6', 12), 14); eq(g.winFor('buy4', 20), 39); eq(g.winFor('lay4', 40), 19); eq(g.winFor('hard8', 5), 45); eq(g.winFor('horn', 4), 27); eq(g.winFor('any7', 5), 20); });
test('Stats: rolls, points made, seven-outs, longest hand', () => { const g = G(); for (const t of [6, 5, 6, 8, 3, 8, 4, 7]) R(g, t); eq(g.stats.rolls, 8); eq(g.stats.pointsMade, 2); eq(g.stats.sevenOuts, 1); eq(g.stats.longestRoll, 8); eq(g.stats.currentRoll, 0); });
test('History records rolls and caps at 500', () => { const g = G(); for (let i = 0; i < 520; i++) R(g, 9); eq(g.history.length, 500); eq(g.history[499].total, 9); });
test('serialize / restore round-trip', () => { const g = G(); g.placeBet('pass', 10); R(g, 6); g.placeBet('passOdds', 20); g.placeBet('place8', 12); g.setWorking('place8', false); const s = JSON.parse(JSON.stringify(g.serialize())); const h = CrapsGame.restore(s); eq(h.point, 6); eq(h.bets.passOdds, 20); eq(h.bankroll, g.bankroll); eq(h.isWorking('place8'), false); eq(ev(h.resolveRoll(3, 3), 'passOdds').win, 24); });
test('restore() discards corrupt bets', () => { const h = CrapsGame.restore({ bankroll: 50, point: 7, bets: { pass: 10, bogus: 5, field: -3 } }); eq(h.point, null); eq(h.bets.pass, 10); eq(h.bets.bogus, undefined); eq(h.bets.field, undefined); });

section('One box per number (place / buy)');
test('Buy 6 rejected while Place 6 is up', () => { const g = G(); g.placeBet('place6', 12); const v = g.placeBet('buy6', 25); eq(v.ok, false); eq(v.reason, 'You already have a Place bet on 6 — take it down to buy it'); eq(g.bets.buy6, undefined); });
test('Place 4 rejected while Buy 4 is up', () => { const g = G(); g.placeBet('buy4', 20); const v = g.placeBet('place4', 10); eq(v.ok, false); ok(/Buy bet on 4/.test(v.reason), v.reason); });
test('Place 6 + Buy 8 on different numbers is fine; take down then buy works', () => { const g = G(); eq(g.placeBet('place6', 12).ok, true); eq(g.placeBet('buy8', 25).ok, true); g.removeBet('place6'); eq(g.placeBet('buy6', 25).ok, true); });

section('Working ON/OFF (per bet, lammers)');
test('canToggleWorking: box, odds, hardways, big 6/8 only', () => { const g = G(); for (const id of ['place6', 'buy4', 'lay10', 'comeOdds5', 'dontComeOdds9', 'hard8', 'big6']) eq(g.canToggleWorking(id), true, id); for (const id of ['pass', 'field', 'come', 'horn', 'any7', 'hop15', 'foo']) eq(g.canToggleWorking(id), false, id); });
test('offBets on the come-out: place, buy, hardways, come odds are OFF; lay, field, line are not', () => {
  const g = G(5000); g.placeBet('pass', 10); R(g, 6); g.placeBet('come', 10); R(g, 5); g.placeBet('comeOdds5', 20); R(g, 6); // point made: come-out
  for (const [id, a] of [['place8', 12], ['buy4', 20], ['hard8', 5], ['lay10', 40], ['field', 5], ['big6', 10]]) g.placeBet(id, a);
  const off = g.offBets().sort(); eq(off.join(','), ['buy4', 'comeOdds5', 'hard8', 'place8'].sort().join(','));
});
test('Everything works again once the point is on (no OFF lammers)', () => { const g = G(); g.placeBet('place8', 12); g.placeBet('hard6', 5); eq(g.offBets().length, 2); g.placeBet('pass', 10); R(g, 5); eq(g.offBets().length, 0); });
test('toggleWorking turns one place bet ON for the come-out (and 7 then takes it)', () => { const g = G(); g.placeBet('place6', 12); g.placeBet('place8', 12); const t = g.toggleWorking('place6'); eq(t.ok, true); eq(t.working, true); eq(g.isWorking('place8'), false); const r = R(g, 7); eq(ev(r, 'place6').type, 'lose'); ok(isOff(ev(r, 'place8')), 'place8 OFF event'); eq(g.bets.place8, 12); });
test('toggleWorking turns one place bet OFF during a point', () => { const g = G(); g.placeBet('pass', 10); R(g, 5); g.placeBet('place6', 12); g.placeBet('place8', 12); eq(g.toggleWorking('place8').working, false); eq(g.offBets().join(), 'place8'); const r = R(g, 8); ok(isOff(ev(r, 'place8')), 'OFF event'); eq(ev(r, 'place8').note, 'Off'); R(g, 6); eq(g.bankroll, 1000 - 34 + 14); });
test('toggleWorking rejects missing and always-working bets', () => { const g = G(); eq(g.toggleWorking('place6').ok, false); g.placeBet('field', 5); const t = g.toggleWorking('field'); eq(t.ok, false); ok(/always working/.test(t.reason), t.reason); eq(g.working.field, undefined); });
test("'working' event fires on toggle with the new state", () => { const g = G(); let got = null; g.on('working', (p) => { got = p; }); g.placeBet('hard4', 5); g.toggleWorking('hard4'); eq(got.id, 'hard4'); eq(got.working, true); });
test('Override cleared when the bet comes down', () => { const g = G(); g.placeBet('pass', 10); R(g, 5); g.placeBet('place6', 12); g.setWorking('place6', false); g.removeBet('place6'); eq(g.working.place6, undefined); });
test('Hard way OFF with override: easy 8 does not lose it', () => { const g = G(); g.placeBet('pass', 10); R(g, 5); g.placeBet('hard8', 5); g.toggleWorking('hard8'); R(g, 8); eq(g.bets.hard8, 5); });

section('Put bets');
test('Put pass after the point: accepted, contract, takes odds', () => { const g = G(); R(g, 6); eq(g.point, 6); eq(g.placeBet('pass', 10).ok, true); eq(g.canRemove('pass').ok, false); eq(g.maxFor('passOdds'), 50); g.placeBet('passOdds', 50); const r = R(g, 6); eq(ev(r, 'pass').win, 10); eq(ev(r, 'passOdds').win, 60); });
test('Put pass loses on seven-out', () => { const g = G(); R(g, 9); g.placeBet('pass', 10); eq(ev(R(g, 7), 'pass').type, 'lose'); });
test('Put bet name in tooltip info, normal pass name in events', () => { const g = G(); R(g, 6); ok(/Put Bet/.test(g.betInfo('pass').name), g.betInfo('pass').name); const h = G(); h.placeBet('pass', 10); R(h, 6); eq(h.betInfo('pass').name, 'Pass Line'); eq(ev(R(h, 6), 'pass').name, 'Pass Line'); });

section('Fire Bet');
const shoot = (g, seq) => { for (const x of seq) Array.isArray(x) ? g.resolveRoll(...x) : R(g, x); };
test('Accepted only before the shooter\'s first roll; contract after', () => { const g = G(); eq(g.placeBet('fire', 5).ok, true); R(g, 8); eq(g.placeBet('fire', 5).ok, false); eq(g.canRemove('fire').ok, false); const h = G(); h.placeBet('fire', 5); eq(h.removeBet('fire').ok, true); });
test('Three points then seven-out loses', () => { const g = G(); g.placeBet('fire', 5); shoot(g, [4, 4, 5, 5, 6, 6, 8, 7]); eq(g.bets.fire, undefined); eq(g.bankroll, 995); });
test('Four unique points pays 24:1 at the seven-out', () => { const g = G(); g.placeBet('fire', 5); shoot(g, [4, 4, 5, 5, 6, 6, 4, 4, 9, 9, 8, 7]); const r = g.history.at(-1); eq(r.outcome, 'seven-out'); eq(g.bets.fire, undefined); eq(g.bankroll, 1000 + 5 * FIRE_PAYS[4]); });
test('Repeated points count once', () => { const g = G(); g.placeBet('fire', 1); const r = []; shoot(g, [4, 4, 4, 4, 4, 4, 5, 5]); eq(g.firePoints.join(), '4,5'); });
test('All six points pays 999:1 at once', () => { const g = G(); g.placeBet('fire', 1); let r; for (const n of POINTS) { R(g, n); r = R(g, n); } eq(ev(r, 'fire').win, 999); eq(ev(r, 'fire').down, true); eq(g.bankroll, 1999); });
test('Fire points reset for the next shooter', () => { const g = G(); shoot(g, [4, 4, 5, 5, 6, 7]); eq(g.firePoints.length, 0); eq(g.placeBet('fire', 5).ok, true); });

test('Tall loses on a 7 (including a come-out 7)', () => { const g = G(); g.placeBet('tall', 5); R(g, 8); R(g, 12); eq(ev(R(g, 7), 'tall').type, 'lose'); });
test('Make \'Em All: needs every total, pays 175:1', () => { const g = G(); g.placeBet('all', 1); for (const t of [2, 3, 4, 5, 6, 8, 9, 10, 11]) R(g, t); eq(ev(R(g, 12), 'all').win, 175); });
test('ATS only before any number rolls since the last 7', () => { const g = G(); R(g, 4); eq(g.placeBet('small', 5).ok, false); R(g, 7); eq(g.placeBet('small', 5).ok, true); R(g, 5); eq(g.canRemove('small').ok, false); });
test('ATS edge with engine payouts: Small/Tall 7.76%, All 7.46%', () => { for (const [k, e] of [['small', 7.76], ['tall', 7.76], ['all', 7.46]]) { const p = probAllBeforeSeven(ATS[k].nums); near((-(p * ATS[k].pays - (1 - p))) * 100, e, 0.02, k); } });

section('restore() validation');
const conserve = (o) => { const h = CrapsGame.restore(o); const before = o.bankroll + Object.values(o.bets || {}).filter((a) => Number.isInteger(a) && a > 0).reduce((a, b) => a + b, 0); return [h, before]; };
test('Orphan pass odds (no flat) refunded', () => { const [h, v] = conserve({ bankroll: 100, point: 6, bets: { passOdds: 50 } }); eq(h.bets.passOdds, undefined); eq(h.bankroll, 150); eq(h.totalValue(), v); });
test('Pass odds with no point refunded', () => { const h = CrapsGame.restore({ bankroll: 100, point: null, bets: { pass: 10, passOdds: 20, dontPassOdds: 20 } }); eq(h.bets.pass, 10); eq(h.bets.passOdds, undefined); eq(h.bets.dontPassOdds, undefined); eq(h.bankroll, 140); });
test('Odds above the 3-4-5x cap trimmed to the cap, excess refunded', () => { const [h, v] = conserve({ bankroll: 0, point: 4, bets: { pass: 10, passOdds: 100, dontPass: 10, dontPassOdds: 500 } }); eq(h.bets.passOdds, 30); eq(h.bets.dontPassOdds, 60); eq(h.totalValue(), v); });
test('Come odds without a come bet dropped; capped with one', () => { const [h, v] = conserve({ bankroll: 0, point: 6, bets: { comeOdds5: 20, come9: 10, comeOdds9: 90, dontCome4: 10, dontComeOdds4: 30 } }); eq(h.bets.comeOdds5, undefined); eq(h.bets.comeOdds9, 40); eq(h.bets.dontComeOdds4, 30); eq(h.totalValue(), v); });
test('Bar come bets with the puck OFF refunded', () => { const h = CrapsGame.restore({ bankroll: 0, point: null, bets: { come: 10, dontCome: 10 } }); eq(h.totalOnTable(), 0); eq(h.bankroll, 20); });
test('Flats above the table max capped', () => { const [h, v] = conserve({ bankroll: 0, point: null, bets: { pass: 9000, field: 6000 } }); eq(h.bets.pass, 5000); eq(h.bets.field, 5000); eq(h.totalValue(), v); });
test('Place + buy on one number: only one survives; bad horn units refunded', () => { const [h, v] = conserve({ bankroll: 0, point: 6, bets: { place8: 12, buy8: 25, horn: 5, ce: 3, world: 7 } }); eq(!!h.bets.place8 + !!h.bets.buy8, 1); eq(h.bets.horn, undefined); eq(h.bets.ce, undefined); eq(h.bets.world, undefined); eq(h.totalValue(), v); });
test('working: only booleans for toggleable bets on the table', () => { const h = CrapsGame.restore({ bankroll: 100, point: 6, bets: { place8: 12, place6: 12, field: 5 }, working: { foo: true, place8: 'yes', place6: false, field: false, place5: true } }); eq(JSON.stringify(h.working), '{"place6":false}'); eq(h.isWorking('place8'), true); });
test('stats/settings: unknown keys and wrong types ignored', () => { const h = CrapsGame.restore({ bankroll: 100, settings: { tableMax: '9', bogus: 1, fieldTwelvePays: 2, odds: -3 }, stats: { rolls: 12, foo: 3, pointsMade: 'x' } }); eq(h.settings.tableMax, 5000); eq(h.settings.bogus, undefined); eq(h.settings.fieldTwelvePays, 2); eq(h.settings.odds, '345'); eq(h.stats.rolls, 12); eq(h.stats.foo, undefined); eq(h.stats.pointsMade, 0); });
test('Garbage input gives a clean default game', () => { for (const o of [null, undefined, 5, 'x', [], { bankroll: -5 }, { bankroll: NaN, bets: 'x', history: 'y' }]) { const h = CrapsGame.restore(o); eq(h.bankroll, 1000); eq(h.totalOnTable(), 0); eq(h.point, null); } });
test('Round-trip keeps fire / ATS tracking', () => { const g = G(); g.placeBet('fire', 5); g.placeBet('small', 5); shoot(g, [4, 4, 2, 3]); const h = CrapsGame.restore(JSON.parse(JSON.stringify(g.serialize()))); eq(h.firePoints.join(), '4'); eq(h.atsHits.sort((a, b) => a - b).join(), '2,3,4'); eq(h.bets.fire, 5); eq(h.bets.small, 5); eq(h.totalValue(), g.totalValue()); });

test('restore() clamps nonsense numeric settings', () => {
  const h = CrapsGame.restore({ bankroll: 100, settings: { tableMax: 0, propMin: 0, vigRate: 9, fieldTwoPays: 0, fieldTwelvePays: 7, tableMin: -4, odds: 1e9 } });
  eq(h.settings.tableMin, 1, 'tableMin'); ok(h.settings.tableMax >= h.settings.tableMin, 'tableMax >= tableMin'); eq(h.settings.propMin, 1, 'propMin');
  eq(h.settings.vigRate, 0.1, 'vig'); eq(h.settings.fieldTwoPays, 2, 'field 2'); eq(h.settings.fieldTwelvePays, 3, 'field 12'); eq(h.settings.odds, 100, 'odds');
  eq(h.placeBet('pass', 1).ok, true, 'a bet is still possible');
});

test('sanitizeSettings: table max below min raised; odds 0 / NaN rejected; booleans typed', () => {
  const s = sanitizeSettings({ tableMin: 25, tableMax: 10, odds: 0, putBets: 'no', vigRate: -1 }); eq(s.tableMax, 25); eq(s.odds, '345'); eq(s.putBets, true); eq(s.vigRate, 0);
  eq(sanitizeSettings({ odds: NaN }).odds, '345'); eq(sanitizeSettings({ odds: 2.4 }).odds, 2); eq(sanitizeSettings(null).tableMin, 5);
});

section('Odds allowance (round up to a payable unit)');
test('$15 flat on 5 at 1x may take $16 odds (pays $24)', () => { const g = G(1000, { odds: 1 }); g.placeBet('pass', 15); R(g, 5); eq(g.maxFor('passOdds'), 16); eq(g.placeBet('passOdds', 16).ok, true); eq(g.placeBet('passOdds', 1).ok, false); eq(ev(R(g, 5), 'passOdds').win, 24); });
test('$12 flat on 6/8 at 1x may take $15 odds (pays $18); $25 flat takes $25', () => { for (const n of [6, 8]) { const g = G(1000, { odds: 1 }); g.placeBet('pass', 12); R(g, n); eq(g.maxFor('passOdds'), 15, 'n' + n); eq(g.placeBet('passOdds', 15).ok, true); eq(ev(R(g, n), 'passOdds').win, 18); const h = G(1000, { odds: 1 }); h.placeBet('pass', 25); R(h, n); eq(h.maxFor('passOdds'), 25); } });
test('$15 at 2x on 6 allows exactly $30; on 4 no rounding needed', () => { const g = G(1000, { odds: 2 }); g.placeBet('pass', 15); R(g, 6); eq(g.maxFor('passOdds'), 30); const g2 = G(1000, { odds: 2 }); g2.placeBet('pass', 15); R(g2, 4); eq(g2.maxFor('passOdds'), 30); });
test('$7 flat at 2x on 6 rounds $14 up to $15', () => { const g = G(1000, { odds: 2 }); g.placeBet('pass', 7); R(g, 6); eq(g.maxFor('passOdds'), 15); });
test('Come odds use the same allowance', () => { const g = G(1000, { odds: 1 }); g.placeBet('pass', 10); R(g, 4); g.placeBet('come', 15); R(g, 9); eq(g.maxFor('comeOdds9'), 16); eq(g.placeBet('comeOdds9', 16).ok, true); });
test('Lay odds allowance: $15 DP on 5 at 1x may lay $24 (win $16)', () => { const g = G(1000, { odds: 1 }); g.placeBet('dontPass', 15); R(g, 5); eq(g.maxFor('dontPassOdds'), 24); g.placeBet('dontPassOdds', 24); eq(ev(R(g, 7), 'dontPassOdds').win, 16); });
test('Lay odds allowance: $27 DC on 8 at 1x may lay $36 (win $30)', () => { const g = G(1000, { odds: 1 }); g.placeBet('pass', 10); R(g, 4); g.placeBet('dontCome', 27); R(g, 8); eq(g.maxFor('dontComeOdds8'), 36); eq(g.placeBet('dontComeOdds8', 36).ok, true); eq(g.placeBet('dontComeOdds8', 1).ok, false); });
test('3-4-5x limits unchanged by the allowance', () => { for (const [n, flat, max, lay] of [[4, 10, 30, 60], [5, 10, 40, 60], [6, 10, 50, 60], [5, 15, 60, 90], [6, 15, 75, 90]]) { const g = G(5000); g.placeBet('pass', flat); g.placeBet('dontPass', flat); R(g, n); eq(g.maxFor('passOdds'), max, 'take ' + n + '/' + flat); eq(g.maxFor('dontPassOdds'), lay, 'lay ' + n + '/' + flat); } });

section('reset() and Put warnings');

  const g = G(); g.placeBet('fire', 5); g.placeBet('pass', 10); R(g, 6); g.placeBet('place8', 12); g.toggleWorking('place8'); R(g, 5);

  eq(g.totalOnTable(), 0); eq(g.point, null); eq(JSON.stringify(g.working), '{}'); eq(g.firePoints.length, 0); eq(g.atsHits.length, 0); eq(g.history.length, 0); eq(g.stats.currentRoll, 0); eq(g.stats.rolls, 0); eq(g.bankroll, 1000); eq(fired, 1);
  g.placeBet('pass', 10); R(g, 6); g.placeBet('place8', 12); eq(g.isWorking('place8'), true, 'new place 8 is ON');
});

test('Put bet info carries a clear warning', () => { const g = G(); g.placeBet('dontPass', 10); R(g, 4); const i = g.betInfo('pass'); eq(i.put, true); eq(i.warn, PUT_WARN); ok(/odds/.test(i.warn)); const g2 = G(); eq(g2.betInfo('pass').warn, undefined); });

test('Put 6 on a number box: warned, paid 1:1, odds allowed, contract bet', () => {
  const g = G(); g.placeBet('pass', 10); R(g, 5); const i = g.betInfo('come6'); eq(i.put, true); eq(i.name, 'Put 6'); eq(i.warn, PUT_WARN);
  eq(g.placeBet('come6', 10).ok, true); eq(g.betInfo('come6').put, true, 'raising a booked Put is still a Put'); eq(g.betInfo('come6').name, 'Come 6'); eq(g.canRemove('come6').ok, false, 'contract');
  eq(g.placeBet('comeOdds6', 50).ok, true); const r = R(g, 6); eq(ev(r, 'come6').win, 10); eq(ev(r, 'comeOdds6').win, 60);

});

section('Odds chips booked in payable units (dealer rounding)');
const pt = (n, flat = 10, bank = 1000, s) => { const g = G(bank, s); g.placeBet('pass', flat); R(g, n); return g; };
test('$25 chip behind a 5 books $24 + $1 change (tie: down, pays $36, nothing pulled from the rack)', () => { const g = pt(5); const s = g.oddsStake('passOdds', 25); eq(s.add, 24); eq(s.rounded, 'down'); eq(s.extra, 0); eq(s.change, 1); eq(g.placeBet('passOdds', s.add).ok, true); eq(g.winFor('passOdds'), 36); eq(g.bankroll, 1000 - 10 - 24); });
test('$25 chip behind a 9 rounds DOWN to $24 when only $25 is left in the rack', () => { const g = pt(9, 10, 35); eq(g.bankroll, 25); const s = g.oddsStake('passOdds', 25); eq(s.add, 24); eq(s.rounded, 'down'); eq(s.change, 1); });
test('Round up is refused past the odds limit: $5 flat on 5 (4x = $20) + $25 chip -> $20 capped', () => { const g = pt(5, 5); eq(g.maxFor('passOdds'), 20); const s = g.oddsStake('passOdds', 25); eq(s.add, 20); eq(s.rounded, 'capped'); eq(s.change, 5); });
test('$1 chips behind a 6 stay pending until $5, then book $5', () => { const g = pt(6); let p = 0; for (let i = 0; i < 4; i++) { const s = g.oddsStake('passOdds', 1, p); eq(s.add, 0); p = s.pending; } eq(p, 4); const s = g.oddsStake('passOdds', 1, p); eq(s.add, 5); eq(s.pending, 0); eq(g.placeBet('passOdds', 5).ok, true); eq(g.winFor('passOdds'), 6); });
test('$1 chip on odds behind a 6 never books an unpayable $1', () => { const g = pt(8); const s = g.oddsStake('passOdds', 1); eq(s.add, 0); eq(s.pending, 1); eq(s.short, 4); });
test('$5 chip behind a 4 books $5 as is (pays $10)', () => { const g = pt(4); const s = g.oddsStake('passOdds', 5); eq(s.add, 5); eq(s.rounded, null); });
test('$25 chip on 6/8 odds books $25 (clean, pays $30)', () => { const g = pt(6); const s = g.oddsStake('passOdds', 25); eq(s.add, 25); eq(s.rounded, null); });
test('$5 chip on 6 odds on top of $25 is clean ($30 pays $36)', () => { const g = pt(6, 10); g.placeBet('passOdds', 25); const s = g.oddsStake('passOdds', 5); eq(s.add, 5); g.placeBet('passOdds', 5); eq(g.winFor('passOdds'), 36); });
test('Lay odds against 4: $25 chip -> $24 (tie goes down, wins $12, $1 change)', () => { const g = G(); g.placeBet('dontPass', 10); R(g, 4); eq(g.unitFor('dontPassOdds'), 2); const s = g.oddsStake('dontPassOdds', 25); eq(s.add, 24); eq(s.change, 1); g.placeBet('dontPassOdds', 24); eq(g.winFor('dontPassOdds'), 12); });

section('House edge (exact, from engine payouts)');
const EDGES = [
  ['pass', 30, -1.414, 0.01], ['dontPass', 30, -1.364, 0.01], ['field', 30, -2.778, 0.01],
  ['place6', 30, -1.515, 0.01], ['place5', 30, -4.0, 0.01], ['place4', 30, -6.667, 0.01],
  ['big8', 30, -9.091, 0.01], ['hard8', 30, -9.091, 0.01], ['hard4', 30, -11.111, 0.01],
  ['any7', 30, -16.667, 0.01], ['anyCraps', 30, -11.111, 0.01], ['eleven', 30, -11.111, 0.01],
  ['twelve', 30, -13.889, 0.01], ['horn', 40, -12.5, 0.01], ['ce', 30, -11.111, 0.01],
  ['buy4', 20, -1.667, 0.01], ['lay4', 40, -1.667, 0.01],
  ['world', 50, -13.333, 0.01], ['hop15', 30, -11.111, 0.01], ['hop33', 30, -13.889, 0.01],

];
const edgeBox = document.getElementById('edges');
for (const [id, amt, edge, tol] of EDGES) test(`${betInfo(id).name}: house edge ${(-edge).toFixed(3)}%`, () => { const e = expectedValue(id, amt) * 100; near(e, edge, tol, id); edgeBox.insertAdjacentHTML('beforeend', `<span>${betInfo(id).name} <b>${(-e).toFixed(2)}%</b></span>`); });
test('Free odds have zero house edge (all numbers)', () => { for (const n of POINTS) { const p = WAYS[n] / (WAYS[n] + 6); const [a, b] = TRUE_ODDS[n]; near(p * (a / b) - (1 - p), 0, 1e-12, 'take ' + n); const [c, d] = LAY_ODDS[n]; near((1 - p) * (c / d) - p, 0, 1e-12, 'lay ' + n); } });
test('Put bet edge from engine: 33.3% on 4/10, 20% on 5/9, 9.09% on 6/8', () => {
  for (const [n, e] of [[4, 33.333], [10, 33.333], [5, 20], [9, 20], [6, 9.091], [8, 9.091]]) {
    let s = 0, w = 0;
    for (let a = 1; a <= 6; a++) for (let c = 1; c <= 6; c++) { const g = G(1e6); g.point = n; g.placeBet('pass', 30); const x = ev(g.resolveRoll(a, c), 'pass'); if (x) { s += x.type === 'win' ? x.win : -x.stake; w++; } }
    near(-s / w / 30 * 100, e, 0.01, 'put ' + n);
  }
});
test('Put + max odds on 6 drops the edge to 1.52%', () => { let s = 0, w = 0; for (let a = 1; a <= 6; a++) for (let c = 1; c <= 6; c++) { const g = G(1e6); g.point = 6; g.placeBet('pass', 10); g.placeBet('passOdds', 50); const r = g.resolveRoll(a, c); if (ev(r, 'pass')) { s += r.net; w++; } } near(-s / w / 60 * 100, 1.515, 0.01, 'put+odds'); });

  const o = mk().rollOutcomes();
  for (const r of o.rows) { const g = mk(); eq(g.resolveRoll(r.d1, r.d2).net, r.net, `${r.d1}-${r.d2}`); }
  eq(o.rows.find((r) => r.d1 === 4 && r.d2 === 4).net, 900 - 1000, 'Hard 8 $100 wins $900, the $1000 Field loses');
  eq(mk().resolveRoll(4, 4).events.find((e) => e.id === 'hard8').win, 900);
  eq(mk().resolveRoll(3, 3).events.find((e) => e.id === 'place6').win, 1162, 'Place 6 $996 pays 7:6');
});
test('rollOutcomes is a raw copy: even a bet a reload would trim is resolved as it really stands', () => {
  const g = bigTable(); g.settings = { ...g.settings, tableMax: 1000 }; // forced past setSettings (as an old save might)
  const o = g.rollOutcomes(); const h = bigTable(); h.settings = { ...h.settings, tableMax: 1000 };
  eq(o.rows.find((r) => r.d1 === 3 && r.d2 === 4).net, h.resolveRoll(3, 4).net, 'seven row'); eq(o.rows.find((r) => r.d1 === 3 && r.d2 === 4).net, -(5000 + 100 + 3000 + 500 + 2000));
  eq(o.rows.find((r) => r.d1 === 2 && r.d2 === 2).net, 5000 + 200 + 2000, 'hard 4: pass + odds 2:1 + field 1:1, all at their real (over-limit) size');
});
test('Lowering the odds multiple trims odds already up (3x -> 1x on a 4: $30 -> $10)', () => {
  const g = pt(4); g.placeBet('passOdds', 30); const v0 = worth(g); const r = g.setSettings({ odds: 1 }); eq(g.bets.passOdds, 10); eq(worth(g), v0); eq(r.trimmed[0].refund, 20);
  const d = G(); d.placeBet('dontPass', 10); R(d, 6); d.placeBet('dontPassOdds', 60); d.setSettings({ odds: 2 }); eq(d.bets.dontPassOdds, 24, 'lay odds to win 2x $10 on the 6');
});
test("No free decision: switching buyVig to 'upfront' with Buy 4 $20 up charges the $1 now; hard 4 adds +$39", () => {
  const g = pt(6); g.placeBet('buy4', 20); const v0 = worth(g), b0 = g.bankroll;
  const r = g.setSettings({ buyVig: 'upfront' }); eq(r.charges.length, 1); eq(r.charges[0].vig, 1); eq(g.bankroll, b0 - 1); eq(g.vigPaid.buy4, 1); eq(worth(g), v0, 'prepaid vig is still value');
  g.resolveRoll(2, 2); eq(worth(g) - v0, 39); eq(g.vigPaid.buy4, 1, 'next decision prepaid');
});
test("No free decision: switching layVig to 'upfront' with Lay 4 $40 up; a 7 adds +$19 (also when the rack is empty)", () => {
  const g = G(1000); R(g, 6); g.placeBet('lay4', 40); const v0 = worth(g); g.setSettings({ layVig: 'upfront' }); eq(g.vigPaid.lay4, 1); R(g, 7); eq(worth(g) - v0, 19);
  const e = G(40); R(e, 6); e.placeBet('lay4', 40); eq(e.bankroll, 0); const r = e.setSettings({ layVig: 'upfront' }); eq(r.charges.length, 0, 'rack cannot cover it');
  const w = ev(R(e, 7), 'lay4'); eq(w.win, 18, 'this decision and the next taken from the $20 win'); ok(/this decision and the next/.test(w.note), w.note); eq(worth(e), 40 + 19);
});
test("restore() of an 'upfront' table with no prepaid vig still collects it from the win", () => {
  const h = CrapsGame.restore({ bankroll: 1000, point: 6, settings: { buyVig: 'upfront' }, bets: { buy4: 20 } }); const v0 = worth(h);
  eq(ev(h.resolveRoll(2, 2), 'buy4').win, 38); eq(worth(h) - v0, 39);
  const l = CrapsGame.restore({ bankroll: 1000, point: 6, settings: { layVig: 'upfront' }, bets: { lay4: 40 } }); const l0 = worth(l); R(l, 7); eq(worth(l) - l0, 19);
});
test('chipStake caps flats, props and unit bets at the max with change (dealer books what fits)', () => {
  const g = G(1e5); g.placeBet('field', 4990); const s = g.chipStake('field', 25); eq(s.add, 10); eq(s.change, 15); eq(s.rounded, 'capped'); eq(g.validate('field', s.add).ok, true);
  const f = G(1e5); f.placeBet('field', 5000); const t = f.chipStake('field', 25); eq(t.add, 0); eq(t.change, 25); eq(t.rounded, 'capped');
  const h = G(1e5, { propMax: 50 }); h.placeBet('horn', 48); const u = h.chipStake('horn', 25); eq(u.add, 0); eq(u.change, 25); eq(u.rounded, 'capped');
  const k = G(1e5, { propMax: 50 }); k.placeBet('horn', 40); const x = k.chipStake('horn', 25); eq(x.add, 8); eq(x.change, 17); eq(k.validate('horn', 8).ok, true);
  const c = G(1e5, { propMax: 50 }); c.placeBet('ce', 46); eq(c.chipStake('ce', 25).add, 4); const w = G(1e5, { propMax: 52 }); w.placeBet('world', 45); eq(w.chipStake('world', 25).add, 5);
  const a = G(1e5, { propMax: 100 }); a.placeBet('any7', 90); const y = a.chipStake('any7', 25); eq(y.add, 10); eq(y.change, 15);
  const p = G(); p.placeBet('horn', 4); eq(p.chipStake('horn', 1).pending, 1, 'small chips still accumulate below the max');
});
test('restore() trims boxes, buys and lays to payable totals (Place 6 $4998, Buy 5 $5000, Lay 5 $7500)', () => {
  const [h, v] = conserve({ bankroll: 0, point: 6, bets: { place6: 6000, place8: 5003, buy5: 6000, buy4: 5003, lay5: 9000, lay8: 9999 } });
  eq(h.bets.place6, 4998); eq(h.bets.place8, 4998); eq(h.bets.buy5, 5000); eq(h.bets.buy4, 5000); eq(h.bets.lay5, 7500); eq(h.bets.lay8, 6000); eq(h.totalValue(), v);
  for (const id of Object.keys(h.bets)) eq(h.bets[id] % h.unitFor(id), 0, id);
});
test('limitLabel and maxBookable show only what can be booked', () => {
  const g = G(1e5, { tableMax: 5001 }); eq(g.limitLabel('lay5'), '$9 – $7500 (wins $6 – $5000)'); eq(payout(7500, LAY_ODDS[5]), 5000);
  eq(G().limitLabel('lay4'), '$10 – $10000 (wins $5 – $5000)'); eq(G().limitLabel('lay6'), '$6 – $6000 (wins $5 – $5000)'); eq(G().limitLabel('place6'), '$5 – $4998');
  const p = G(1000, { propMax: 7 }); eq(p.limitLabel('horn'), '$4 – $4'); eq(p.limitLabel('world'), '$5 – $5'); eq(p.limitLabel('hornHigh2'), '$5 – $5'); eq(p.limitLabel('ce'), '$2 – $6'); eq(p.maxBookable('world'), 5); eq(p.maxBookable('hop11'), 7);
  for (const id of ['horn', 'ce', 'world', 'hornHigh3']) ok(p.maxBookable(id) >= p.minFor(id), `${id} has a usable maximum`);
});
test('Buy / Lay limit policy is stated in betInfo', () => {
  ok(/table max on the bet/.test(G().betInfo('buy4').limit)); ok(/commission on top/.test(G().betInfo('buy4').limit));
  ok(/\$5000 win/.test(G().betInfo('lay6').limit)); eq(G().betInfo('place6').limit, undefined);
});
test('rollOutcomes bestTotals / worstTotals: what the player is rooting for', () => {
  const g = pt(6); g.placeBet('place8', 12); const o = g.rollOutcomes();
  eq(o.bestTotals.map((x) => x.total).join(), '8,6'); eq(o.bestTotals[0].net, 14); eq(o.bestTotals[0].ways, 5);
  eq(o.worstTotals.map((x) => x.total).join(), '7'); eq(o.worstTotals[0].net, -22);
  const e = G().rollOutcomes(); eq(e.bestTotals.length, 0); eq(e.worstTotals.length, 0);
});
test("Session P&L uses totalValue: an 'upfront' lay costs nothing until it loses", () => {
  const g = G(1000, { layVig: 'upfront' }); R(g, 6); g.placeBet('lay4', 40); eq(g.totalValue() - 1000, 0); eq(g.bankroll + g.totalOnTable() - 1000, -1, 'the old formula read -$1');
});

// ============================================================
// Heavy simulations run after the first paint, in chunks, so the page responds at once.
const simSec = section('Simulation integrity');
const simTests = [];
const simTest = (name, fn) => {
  const row = document.createElement('div'); row.className = 't'; row.innerHTML = `<b>…</b><span>${name}</span><i></i>`; out.appendChild(row);
  simTests.push({ name, fn, row });
};
const yieldUI = () => new Promise((r) => setTimeout(r, 0));
async function loop(n, chunk, body) { for (let i = 0; i < n; i++) { body(i); if (i % chunk === chunk - 1) await yieldUI(); } }

simTest('Money conservation over 20,000 auto-played rolls', async () => {
  const rng = makeRng(1234); const g = G(1e9); let net = 0;
  await loop(20000, 4000, (i) => { for (const [id, a] of autoStrategy(g, 10, i)) g.placeBet(id, a); const before = worth(g); const r = g.resolveRoll(rollDie(rng), rollDie(rng)); if (Math.abs(worth(g) - before - r.net) > 1e-6) throw new Error('mismatch at roll ' + i); net += r.net; });
  eq(Math.round(worth(g)), Math.round(1e9 + net));
});
simTest('Fuzz: random bets of every type, 15,000 rolls, ledger + invariants', async () => {
  const ids = ['pass', 'dontPass', 'passOdds', 'dontPassOdds', 'come', 'dontCome', 'field', 'big6', 'big8', 'hard4', 'hard6', 'hard8', 'hard10', 'any7', 'anyCraps', 'two', 'three', 'eleven', 'twelve', 'horn', 'ce',
    'world', 'hornHigh2', 'hornHigh3', 'hornHigh11', 'hornHigh12', 'fire', 'small', 'tall', 'all', ...HOP_IDS.filter((_, i) => i % 3 === 0),
    ...POINTS.flatMap((n) => ['place' + n, 'buy' + n, 'lay' + n, 'come' + n, 'comeOdds' + n, 'dontComeOdds' + n])];
  const rng = makeRng(42); const g = G(1e8, { placeWorkingOnComeOut: false }); let accepted = 0;
  await loop(15000, 2500, (i) => {
    for (let k = 0; k < 3; k++) { const id = ids[Math.floor(rng() * ids.length)]; const amt = [1, 2, 4, 5, 6, 8, 10, 12, 25, 30][Math.floor(rng() * 10)]; if (g.placeBet(id, amt).ok) accepted++; }
    if (rng() < 0.1) { const ks = Object.keys(g.bets); if (ks.length) g.removeBet(ks[Math.floor(rng() * ks.length)]); }
    if (rng() < 0.05) { const ks = Object.keys(g.bets).filter((x) => g.canToggleWorking(x)); if (ks.length) g.toggleWorking(ks[Math.floor(rng() * ks.length)]); }
    const before = worth(g); const [a, b] = rollDice(rng); const r = g.resolveRoll(a, b);
    if (Math.abs(worth(g) - before - r.net) > 1e-6) throw new Error(`ledger mismatch roll ${i}`);
    if (g.point && !POINTS.includes(g.point)) throw new Error('bad point');
    if (g.point == null && (g.bets.passOdds || g.bets.dontPassOdds)) throw new Error('odds left with puck OFF');
    for (const n of POINTS) { if (g.bets['comeOdds' + n] && !g.bets['come' + n]) throw new Error('orphan come odds ' + n); if (g.bets['place' + n] && g.bets['buy' + n]) throw new Error('place+buy on ' + n); }
    if (g.bets.come) throw new Error('come bar bet left after roll');
    if (g.bets.dontCome && a + b !== 12) throw new Error("don't come bar bet left after a non-12");
    if (g.bets.horn % 4 || g.bets.ce % 2 || g.bets.world % 5) throw new Error('prop units broken');
    for (const v of Object.values(g.bets)) if (!(v > 0) || !Number.isInteger(v)) throw new Error('bad stake');
    if (!Number.isInteger(g.bankroll)) throw new Error('fractional bankroll at roll ' + i);
    if (i % 500 === 0) { const h = CrapsGame.restore(JSON.parse(JSON.stringify(g.serialize()))); if (h.totalValue() !== g.totalValue()) throw new Error('restore changed value at roll ' + i); }
  });
  ok(accepted > 10000, 'accepted ' + accepted);
});
simTest('Pass line Monte-Carlo edge ≈ 1.41% (60k decisions, ±3σ)', async () => {
  const rng = makeRng(99); const g = G(1e12); let decisions = 0, net = 0;
  while (decisions < 60000) {
    for (let k = 0; k < 5000; k++) { if (!g.bets.pass) g.placeBet('pass', 10); const r = g.resolveRoll(rollDie(rng), rollDie(rng)); const e = ev(r, 'pass'); if (e && e.type !== 'push') { decisions++; net += e.type === 'win' ? 10 : -10; } }
    await yieldUI();
  }
  const edge = -net / (decisions * 10) * 100; ok(Math.abs(edge - 1.414) < 3 * 100 / Math.sqrt(decisions), 'edge ' + edge.toFixed(3) + '%');
});
simTest('Dice RNG is fair (chi-square over 120k rolls)', async () => {
  const rng = makeRng(2024); const c = Array(13).fill(0); const N = 120000; await loop(N, 40000, () => { c[rollDie(rng) + rollDie(rng)]++; });
  let chi = 0; for (let t = 2; t <= 12; t++) { const e = N * WAYS[t] / 36; chi += (c[t] - e) ** 2 / e; } ok(chi < 30, 'chi² ' + chi.toFixed(2));
});
test('Seeded RNG is deterministic', () => { const a = makeRng(7), b = makeRng(7); for (let i = 0; i < 50; i++) eq(rollDie(a), rollDie(b)); });

const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
const banner = document.getElementById('banner');
const summary = document.getElementById('summary');
const sub = '<small>Craps rules engine · src/rules.js · casino rules, payouts, breakage, limits, events</small>';
let simDone = 0;
function report(done) {
  if (done) { banner.className = fail ? 'fail' : 'pass'; banner.textContent = fail ? `${fail} FAILED` : 'ALL PASSED'; }
  else { banner.className = fail ? 'fail' : ''; banner.textContent = fail ? `${fail} FAILED…` : 'RUNNING…'; }
  summary.innerHTML = `${pass} tests passed · ${fail} failed · ${asserts} assertions${done ? '' : ` · ${simTests.length - simDone} simulations running`} ${sub}${failures.length ? `<div class="fails">${failures.slice(0, 6).map(([n, m]) => `<div><b>✗ ${esc(n)}</b> — ${esc(m)}</div>`).join("")}${failures.length > 6 ? `<div>… and ${failures.length - 6} more</div>` : ""}</div>` : ""}`;
}
report(false);
(async () => {
  await yieldUI();
  for (const s of simTests) {
    const a0 = asserts, t0 = performance.now();
    try { await s.fn(); pass++; tally(simSec, true); s.row.className = 't ok'; s.row.innerHTML = `<b>PASS</b><span>${s.name}</span><i>${asserts - a0} · ${Math.round(performance.now() - t0)}ms</i>`; }
    catch (e) { fail++; failures.push([s.name, e.message]); tally(simSec, false); s.row.className = 't bad'; s.row.innerHTML = `<b>FAIL</b><span>${s.name}<span class="msg">${e.message}</span></span>`; }
    simDone++; report(false);
  }
  report(true);
  window.__testsDone = true;
})();
