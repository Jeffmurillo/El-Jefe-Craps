<!doctype html>
<!-- App icon source. Capture: tools\shot.ps1 -Url "tools/icon.html" -Out icons\icon-512.png -W 512 -H 512 -Wait 2000
     Full-bleed (maskable-safe): everything that matters sits inside the central 70% circle. -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block;width:100vw;height:100vh}</style></head>
<body><canvas id="c"></canvas>
<script>
const c = document.getElementById('c'), S = Math.min(innerWidth, innerHeight) || 512;
c.width = c.height = S; const g = c.getContext('2d'), u = S / 512;
// felt background with a soft pool of light
const bg = g.createRadialGradient(S * .5, S * .42, S * .05, S * .5, S * .5, S * .75);
bg.addColorStop(0, '#1d7a58'); bg.addColorStop(.55, '#0b4a35'); bg.addColorStop(1, '#03170f');
g.fillStyle = bg; g.fillRect(0, 0, S, S);
// gold ring
const gold = g.createLinearGradient(0, S * .15, 0, S * .85); gold.addColorStop(0, '#f7e3a6'); gold.addColorStop(.5, '#c8963c'); gold.addColorStop(1, '#7a5420');
g.strokeStyle = gold; g.lineWidth = 12 * u; g.beginPath(); g.arc(S / 2, S / 2, 172 * u, 0, Math.PI * 2); g.stroke();
g.strokeStyle = 'rgba(247,227,166,.35)'; g.lineWidth = 2.5 * u; g.beginPath(); g.arc(S / 2, S / 2, 156 * u, 0, Math.PI * 2); g.stroke();
function die(cx, cy, size, rot, pips) {
  g.save(); g.translate(cx, cy); g.rotate(rot);
  g.shadowColor = 'rgba(0,0,0,.55)'; g.shadowBlur = 18 * u; g.shadowOffsetY = 8 * u;
  const f = g.createLinearGradient(0, -size / 2, 0, size / 2); f.addColorStop(0, '#ef4a53'); f.addColorStop(.55, '#b3121e'); f.addColorStop(1, '#6a050c');
  g.fillStyle = f; g.beginPath(); g.roundRect(-size / 2, -size / 2, size, size, size * .2); g.fill();
  g.shadowColor = 'transparent';
  g.strokeStyle = 'rgba(255,200,200,.45)'; g.lineWidth = 2.5 * u; g.beginPath(); g.roundRect(-size / 2 + 3 * u, -size / 2 + 3 * u, size - 6 * u, size - 6 * u, size * .17); g.stroke();
  g.fillStyle = '#fffaf0'; const q = size * .26;
  for (const [x, y] of pips) { g.beginPath(); g.arc(x * q, y * q, size * .095, 0, Math.PI * 2); g.fill(); }
  g.restore();
}
die(S / 2 - 62 * u, S / 2 + 12 * u, 132 * u, -0.2, [[-1, -1], [0, 0], [1, 1]]);          // 3
die(S / 2 + 66 * u, S / 2 - 16 * u, 132 * u, 0.17, [[-1, -1], [1, -1], [-1, 1], [1, 1]]); // 4  (a seven)
</script></body></html>
